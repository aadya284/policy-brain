apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name: my-app
        image: node
        command: ["node", "-e", "require('http').createServer((req,res)=>res.end('Hello Kubernetes 🚀')).listen(3000)"]